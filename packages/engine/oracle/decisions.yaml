# Differences between the Python and the TypeScript engine that stay on
# purpose (#76 §4.5). The oracle fails on any difference no entry here
# explains, and, in a full run, on an entry that explained nothing.
#
# Only the port tickets add entries, each with its reason and link. Fields:
#
#   id         unique, kebab-case
#   check      parity (default) or self-check (Python against itself)
#   commands   the Python commands whose steps it covers (`pessoa ver`);
#              a parity entry stays dormant, never stale, until one of
#              them is ported
#   scenarios  glob over the pytest id (default '*')
#   path       glob over the difference path (`error.message`,
#              `output.films[*].evidence.*`, `data/sessions/*#body:*`)
#   python     regex the Python value matches (default: anything);
#              `<absent>` stands for no value
#   ts         regex the TypeScript value matches
#   reason     why the difference stays
#   link       the ADR, issue or PR comment that decided it

# The path error names the `local.toml` key, and that file is in English
# after the cutover (ADR 0002): `[paths] data`, not `[caminhos] dados`.
# Add each command whose steps reach this error when you port it.
- id: missing-config-names-the-english-local-toml-key
  commands: [reconstruir]
  path: error.message
  python: "^caminho '\\w+' não configurado: defina FILMES_\\w+ ou \\[caminhos\\] \\w+ em config/local\\.toml$"
  ts: "^caminho '\\w+' não configurado: defina FILMES_\\w+ ou \\[paths\\] \\w+ em config/local\\.toml$"
  reason: local.toml is English after the cutover, so the message names its English section and key
  link: https://github.com/YgorPerez/filmes/issues/82
