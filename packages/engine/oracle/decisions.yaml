# Differences between the Python and the TypeScript engine that stay on
# purpose (#76 §4.5). The oracle fails on any difference no entry here
# explains, and, in a full run, on an entry that explained nothing.
#
# Only the port tickets add entries, each with its reason and link. Fields:
#
#   id         unique, kebab-case
#   check      parity (default) or self-check (Python against itself)
#   commands   the Python commands whose steps it covers (`pessoa ver`);
#              a parity entry stays dormant, never stale, until one of
#              them is ported
#   scenarios  glob over the pytest id (default '*')
#   path       glob over the difference path (`error.message`,
#              `output.films[*].evidence.*`, `data/sessions/*#body:*`)
#   python     regex the Python value matches (default: anything);
#              `<absent>` stands for no value
#   ts         regex the TypeScript value matches
#   reason     why the difference stays
#   link       the ADR, issue or PR comment that decided it

# The path error names the `local.toml` key, and that file is in English
# after the cutover (ADR 0002): `[paths] data`, not `[caminhos] dados`.
# Add each command whose steps reach this error when you port it.
- id: missing-config-names-the-english-local-toml-key
  commands: [reconstruir]
  path: error.message
  python: "^caminho '\\w+' não configurado: defina FILMES_\\w+ ou \\[caminhos\\] \\w+ em config/local\\.toml$"
  ts: "^caminho '\\w+' não configurado: defina FILMES_\\w+ ou \\[paths\\] \\w+ em config/local\\.toml$"
  reason: local.toml is English after the cutover, so the message names its English section and key
  link: https://github.com/YgorPerez/filmes/issues/82

# Decided in #86 (Pessoa files). No fixture scenario reaches these yet, so
# they are not entries (an entry no difference uses goes stale in a full
# run). Whoever ports a command whose steps show one adds the entry, with
# this reason and the link
# https://github.com/YgorPerez/filmes/issues/86:
#
# - Error messages stay Python's word for word, even where they name the
#   Portuguese key of an English file. Two exceptions: the Ajuste hints
#   list the English values ("(use director, writer, cast, series, genre)",
#   "(use none, low ou high)"), and a body line error names
#   "people/<slug>.md, linha N do corpo" (Python: "pessoas/"), because the
#   Python text would point at a wrong value or file. `{item!r}` shows the
#   item's English keys.
# - The repr of a YAML date in an error message is '2026-11-20' (TS keeps
#   dates as text); Python shows datetime.date(2026, 11, 20). Invalid data
#   only.
# - A raw U+2028 or U+2029 in a frontmatter is invalid_data ("frontmatter
#   inválido"): YAML 1.1 reads them as line breaks and the `yaml` package
#   does not. The TS writer escapes them; real filmes-dados has none.
# - An impossible YAML date (2026-02-30) is invalid_data ("frontmatter
#   inválido: ValueError: ...") where Python crashed with `interno`.
# - The TS writer lays out a frontmatter its own way (one flow collection
#   per line, PyYAML's quoting rule). The oracle compares frontmatter as
#   parsed YAML, so this needs no entry.
# - Two Donos stays invalid_data in readPeople/resolvePerson/createPerson;
#   the login decodes each file alone. The Sessions tickets decide.

# The TypeScript engine reads tag_vetoes.toml with English group keys
# (ADR 0002), so the message names that file and lists the keys it has: a
# Python file name and Portuguese keys would point the user at a file and
# values the engine does not read (the exception #86 made for the Ajuste
# hints).
- id: unknown-tag-group-names-the-english-file-and-keys
  commands: [pessoa vetar, pessoa pular]
  path: error.message
  python: "^'.*' não é um grupo de config/vetos_por_tag\\.toml \\(há: comedia_boba, lento\\)$"
  ts: "^'.*' não é um grupo de config/tag_vetoes\\.toml \\(há: silly_comedy, slow\\)$"
  reason: the engine reads config/tag_vetoes.toml, whose group keys are English after the key migration
  link: https://github.com/YgorPerez/filmes/issues/88

# Removing a Feedback comment edits a Session's file, which comes with the
# Sessions' port. Until then `pessoa remover` finds the comment (so a target
# it shares is still ambiguous) and refuses with `internal`. #96 removes
# this entry.
- id: removing-a-feedback-comment-waits-for-sessions
  commands: [pessoa remover]
  scenarios: 'tests/test_pessoa_remover.py::test_comentario_do_feedback_sai_do_arquivo_da_sessao_e_do_banco'
  path: '*'
  reason: removing a Feedback comment edits the Session's file, ported by #96 (ticket #88 leaves the comment case out)
  link: https://github.com/YgorPerez/filmes/issues/88
