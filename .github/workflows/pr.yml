# The pull request gate, modeled on pesquisa-relacionamentos' `pr.yml`. This
# is where the whole suite runs; on the machine, the push hook runs only the
# affected tests (`scripts/verify-push.ts`).
#
# Three jobs in parallel, each on its own runner: `check` (the workspace),
# `stories` (each Storybook story in Chrome) and `build` (the app builds,
# serves `/` and passes the e2e).
#
# Every job has `timeout-minutes`: without it, a stuck job holds the PR for
# GitHub's default six hours.
name: PR

'on':
  pull_request:
    # `master`, and the `spec/*` integration branches the `ticket/*` PRs
    # target.
    branches: [master, 'spec/**']
  workflow_call:

permissions:
  contents: read

# A new push to the same PR cancels the previous run: the result that counts
# is the one for the last commit.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Types and the same `pnpm check` as the machine: format, lint and types
  # (`vp check`), the tests with the coverage floor, fallow and React Doctor.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fallow health` counts how much each file changed in recent
          # months. With a single-commit shallow clone, the score here would
          # differ from the machine's.
          fetch-depth: 0

      # Without `version`, the action reads `packageManager` from the root
      # `package.json`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suppression ceiling and the reason on each new directive
      # (`.github/scripts/suppressions.ts`). A `pull_request` checkout is the
      # PR merged with the base; the target is the PR tip.
      - name: Suppressions
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          TARGET: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/suppressions.ts --base "$BASE" --target "$TARGET"

      # Each package's `tsc`, with the Effect diagnostics.
      - name: Types
        run: pnpm typecheck

      - name: Check
        run: pnpm check

  # Storybook builds, and each story opens in a real Chrome at phone and
  # desktop width (`frontend/vitest.stories.config.ts`), with the ubuntu
  # image's Chrome.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Story tests
        run: pnpm test:stories

      # A failing story leaves its screenshot in `frontend/.vitest/`.
      - name: Upload story screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stories-failures
          path: frontend/.vitest/
          if-no-files-found: ignore
          retention-days: 14

  # The app build, as the deploy will do it, its `/` answering, and the e2e.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Without a Dono logged in, `/` leads to the login page.
      - name: Serve /entrar
        working-directory: frontend
        run: |
          PORT=3000 node .output/server/index.mjs &
          for _ in $(seq 1 20); do
            if curl -fsSL http://localhost:3000/ -o "$RUNNER_TEMP/home.html"; then
              grep -q 'Entrar com Google' "$RUNNER_TEMP/home.html"
              exit $?
            fi
            sleep 1
          done
          echo '::error::The built app did not answer on /.'
          exit 1

      # The app in Chrome, with a stand-in for Google (`e2e/fake-google.ts`)
      # and the engine's fixture (`playwright.config.ts`).
      - name: E2E
        working-directory: frontend
        run: pnpm e2e
