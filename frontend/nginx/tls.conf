# The TLS of the 443 `server` block in `filmes.conf`, with certbot's
# certificate (webroot, `../scripts/prepare-vps.sh`). The deploy installs
# this file at `/etc/nginx/filmes/tls.conf`. The session cache has its own
# name: temestudo's and saude's are other zones on the same Nginx.
ssl_certificate /etc/letsencrypt/live/cinema.temestudo.cloud/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/cinema.temestudo.cloud/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:filmes_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
