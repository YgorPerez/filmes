# The Nginx vhost of cinema.temestudo.cloud, on the VPS that also serves
# temestudo.cloud and saude.temestudo.cloud. The deploy
# (`../scripts/vps.ts`) installs this file at
# `/etc/nginx/sites-available/filmes.conf`, with the link in `sites-enabled/`,
# and only keeps it live if `nginx -t` passes. The app runs in a container on
# 127.0.0.1, on a port of the pair the deploy swaps (blue/green), and the
# current port comes from the include `/etc/nginx/filmes/filmes-app.conf`.
#
# The VPS is shared (ADR 0006): no `default_server` here, since temestudo's
# vhost owns it on 80 and 443. Only requests for cinema.temestudo.cloud
# reach these blocks.
#
# The access_log has no query and no Referer (`log-without-query.conf`) and
# the error_log keeps 3 days (`logrotate-filmes`), both in
# `/var/log/nginx/filmes/`, outside the `*.log` of Ubuntu's rotation.
# `nginx.test.ts` checks this by what is written here.

# Certbot's challenge (webroot) and the rest to https.
server {
  listen 80;
  listen [::]:80;
  server_name cinema.temestudo.cloud;
  access_log /var/log/nginx/filmes/access.log filmes_without_query;
  error_log /var/log/nginx/filmes/error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /opt/filmes/acme;
  }

  location / {
    return 301 https://cinema.temestudo.cloud$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name cinema.temestudo.cloud;
  include /etc/nginx/filmes/tls.conf;
  access_log /var/log/nginx/filmes/access.log filmes_without_query;
  error_log /var/log/nginx/filmes/error.log;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  # The app server sends JS as `text/javascript`, which Nginx does not
  # compress without this line.
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

  location / {
    include /etc/nginx/filmes/filmes-app.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
