# The access_log format of `filmes.conf`. The deploy installs this file at
# `/etc/nginx/conf.d/filmes-log-without-query.conf`, which Ubuntu's
# `nginx.conf` includes inside `http`, before `sites-enabled/`. The names are
# filmes' own: temestudo has its format on the same Nginx.
#
# The path is the request cut before the first `?`. Left out are `$request`,
# `$request_uri`, `$args` and `$http_referer`, which carry the query (an
# OAuth `code`, a search) or the address the visitor came from.
map $request_uri $filmes_path {
  default "-";
  "~^(?<filmes_path_only>[^?]*)" $filmes_path_only;
}

log_format filmes_without_query '$remote_addr [$time_local] "$request_method $filmes_path $server_protocol" $status $body_bytes_sent $request_time "$host"';
