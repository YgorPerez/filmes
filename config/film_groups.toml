# Grupos de filmes da Escolha de grupo (#415): o Link da Sessão pergunta a um
# Presente com menos Notas que `[rating_percentile] min_ratings` "Qual destes
# grupos tem mais a sua cara?", e ela escolhe de 1 a 3 grupos ou nenhum.
#
# Cada grupo tem um nome, 3 filmes (tconst do IMDb) e 3 rótulos. Só os filmes
# viram gosto: são sementes fracas da vizinhança do MovieLens. O nome e os
# rótulos só mostram o grupo na tela. A pesquisa #405 mediu que os rótulos não
# ajudam a recomendar; os filmes, sim.
#
# Feitos uma vez a partir do Tag Genome sobre os Candidatos (k-means esférico
# nas 300 tags de maior variância, K=16 e K=20, banco de 2026-11-24) e revistos
# à mão: cada grupo mostra 3 filmes conhecidos dentre os mais votados perto do
# centro dele, e os rótulos traduzem as tags que mais o distinguem. Saíram os
# grupos de sobra (drogas e depressão, música, política, um de clássicos que
# repetia outro). Um grupo com filme fora do Catálogo não aparece.
#
# Os grupos aparecem na ordem do arquivo. A chave é o id gravado no arquivo da
# Pessoa; não mude a de um grupo que já foi escolhido.

[crime]
name = "Crime e violência"
# Pulp Fiction, O Poderoso Chefão, Clube da Luta
