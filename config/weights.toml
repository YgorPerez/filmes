# Pesos do motor. Valores iniciais da spec (#16), calibrados por `avaliar`.
# A régua de Força (que Fato é forte, moderado ou fraco) é regra fixa no
# código, em packages/engine/src/evidence; aqui ficam os números da ordenação
# e os cortes de percentil com que a régua lê uma Nota.

[strength.multiplier]
# A Força multiplica a contribuição de cada Evidência. Palpite soma 0.
strong = 1.0
moderate = 0.6
weak = 0.3
guess = 0.0

[rating_percentile]
# A régua lê cada Nota pelo percentil dela na escala da Pessoa (#172, decisão do
# Dono de 2026-11-25): a parte das Notas abaixo desta, mais metade das iguais,
# de 0 a 1. Com `min_ratings` Notas ou mais, a escala são as Notas dela (as do
# Letterboxd e as do Trakt já estão na mesma escala de 0,5 a 5); com menos, as
# notas da população do MovieLens. Do percentil a Força sai por estes cortes:
# a partir de `strong` é forte a favor (o top 10%), de `moderate` moderada (e
# conta como Nota alta no caminho de conteúdo), de `weak` fraca; abaixo de
# `weak` é contra: fraca até `weak_against`, moderada até `moderate_against`,
# forte abaixo dele.
min_ratings = 20
strong = 0.9
moderate = 0.7
weak = 0.4
weak_against = 0.2
moderate_against = 0.1

[rating_decay]
# Decaimento de uma Nota (#173): a contribuição dela vale 2^(−idade / meia-vida),
# com a idade em anos até hoje, e nunca menos que o piso. A Força não muda com a
# idade. Declarado e Relato não decaem; o Já visto também não.
half_life_years = 5.0
floor = 0.25

[path.weight]
# Peso de cada tipo de aresta de conteúdo no caminho de gosto. Um predicado fora
# daqui não entra no caminho; o texto de cada um fica em sinais/conteudo.py.
# Gênero só dá metadado, no máximo fraco (régua).
director = 1.0
writer = 0.8
series = 1.0
cast = 0.5
genre = 0.3

[utility]
# Utilidade individual de 0 a 1: u = 1 / (1 + exp(-k * soma das contribuições)).
k = 1.0
# Só as N contribuições de maior módulo de cada Pessoa no filme entram na soma; o
# Já visto fica fora do corte e sempre conta. Sem o corte, quem tem mil Notas
# encosta em dezenas de Evidências por filme e fica com utilidade ~1 em tudo.
max_evidence = 5

[adjustment.level]
# Ajuste de uma Pessoa a um elo do caminho de conteúdo (`pessoa ajustar`): o
# nível multiplica o peso do elo. "nada" tira as Evidências do elo e "pouco"
# também desce a Força um nível (régua).
none = 0.0
low = 0.5
normal = 1.0
high = 1.5

[catalog]
# Mínimo de votos no IMDb para um filme virar Candidato.
min_votes = 1000
# Nota mínima no IMDb para um filme virar Candidato (decisão do Dono, 2026-11-21).
min_imdb_rating = 7.0

[recommendation]
# Quantos filmes a Recomendação devolve quando o pedido não diz.
size = 5

[seen]
# Já visto pesa contra o filme com esta base (a Força é sempre forte).
weight = 1.0

[satisfaction]
# u' = u - fator x (Satisfação mais alta de hoje - a da Pessoa) na Regra padrão.
# A Satisfação olha as últimas `window` Sessões em grupo com Feedback que a
# Pessoa dividiu com algum Presente de hoje. Com dois Presentes, 0,25 dá o mesmo
# que o Crédito de antes (0,5 x a distância até a média).
factor = 0.25
window = 5

[neighbors]
# Peso da Evidência de vizinhança item-item do MovieLens (Tipo review).
weight = 1.0

[taste_neighbors]
# Vizinhos de gosto (#174): os `k` usuários da amostra do MovieLens mais próximos
# da Pessoa, pela diferença média entre o percentil da Nota dela e o da nota
# deles (cada um na própria escala) nos filmes que os dois viram; só conta quem
# viu pelo menos `min_shared` filmes dela. O percentil médio dos vizinhos que
# viram o filme, de 0 a 1, dá a Evidência (Tipo review) com base
# `weight` × 2 × (percentil − 0,5): a favor acima da mediana dela, contra abaixo.
# A menos de `neutral_band` da mediana, eles não dizem nada. A Força vem da
# régua, por quantos são, quanto concordam e quanto dividem com ela.
k = 50
min_shared = 10
weight = 1.0
neutral_band = 0.05

[mood]
# Bônus de cada Clima pedido que o filme sustenta, somado à pontuação da Regra
# de escolha (que vai de 0 a 1), vezes o multiplicador da Força.
weight = 0.1

[group]
# Bônus do filme com tag de grupo numa Sessão em grupo, ou de sozinho numa
# Sessão sozinha, somado à pontuação da Regra, vezes o multiplicador da Força.
# Menor que o do Clima: o Dono não pediu, e a leitura da tag é do projeto.
weight = 0.05

[people]
# Base de um Declarado ou Relato com alvo entidade (diretor, ator, gênero...):
# positiva para ama e gosta, negativa para não gosta e odeia. A Força multiplica.
statement_weight = 1.0

[constraints]
# Só os filmes que chegariam a estas primeiras posições consultam fonte sob
# demanda (OMDb para a classificação, Does the Dog Die para gatilho).
on_demand_reach = 50

[tag_vetoes]
# Mínimos para uma tag de config/tag_vetoes.toml tirar o filme de um Veto por grupo.
# Mais firmes que os do "nada triste": "bobo" é mais subjetivo que "triste".
min_relevance = 0.7
min_users = 10

[imdb_rating]
# Bônus do filme pela nota do IMDb, somado à pontuação da Regra como o do Clima:
# peso × (nota − mínima) / (10 − mínima), com a mínima de [catalogo]. Nota 7 ganha 0.
# 0,3 (decisão do Dono, 2026-11-22): com 0,1, um 8,0 ganhava só 0,033 e quase não mudava a ordem.
weight = 0.3

[no_sad]
# Mínimos para uma tag de config/sadness.toml tirar o filme em `--sem-tristeza`.
# Tema pesado pede menos usuários: Polytechnique tem "massacre" de 2.
min_users_sad = 3
min_users_heavy_theme = 2
min_relevance = 0.6

[similar]
# `recomendar --parecido` (#67): só passam os `candidatos` filmes mais parecidos
# com a referência, contados antes das outras Restrições e da nota mínima.
candidates = 50
# Tags do genoma da referência que contam: as mais próprias dela (relevância
# acima da média da tag no genoma). As candidatas a isso são as de maior relevância.
genome_tags = 15
genome_tags_considered = 40
# Tags do MovieLens da referência que buscam filmes: as de mais peso (TF-IDF).
movielens_tags = 20

[similar.weight]
# Parecença de 0 a 1: soma destes pesos vezes a parecença de cada fonte (0 a 1).
# Fonte sem dado para o par fica de fora e o peso dela se redistribui entre as outras.
genome = 0.35
movielens_tags = 0.25
neighbors = 0.2
genre = 0.1
people = 0.1

[diversity]
# Diversidade (#177): MMR na ordem final. Cada lugar seguinte vai para o filme
# com o maior λ × pontuação − (1 − λ) × a maior Parecença (a do `--parecido`,
# medida a partir do filme de cima) com os filmes já escolhidos acima dele.
# A pontuação é a primeira da Regra de escolha, com os bônus do filme; a faixa
# (com Fato, só sinais do filme, só palpites) continua vindo antes. λ = 1 desliga.
# Desligado até o `evaluate` no banco real e as Sessões do Dono provarem um
# valor (mapa #169); nas Notas da fixture, 0,8 baixa a parecença do top 5.
lambda = 1.0
# Só os `depth` primeiros lugares saem do MMR, escolhidos entre os `pool`
# primeiros filmes da ordem; os demais seguem a Regra. A Parecença só é medida
# entre esses filmes.
depth = 10
pool = 30
